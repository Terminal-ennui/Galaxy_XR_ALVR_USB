name: Build Galaxy XR APK - Beta 0.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'ci/**'
      - 'patches/**'
  pull_request:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'ci/**'
      - 'patches/**'

permissions:
  contents: read

concurrency:
  group: galaxy-xr-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out this project's patch and build script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out the pinned ALVR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: alvr-org/ALVR
          ref: ca2decae968f2fd37b43b777cca4ba597808ba52
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and audit the test APK
        shell: bash
        run: bash ci/build-apk.sh

      - name: Save downloadable test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Galaxy-XR-ALVR-beta-0.1-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
